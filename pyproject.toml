[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-dimensioner"
version = "0.1.0"
description = "Raspberry Pi parcel dimensioning, weighing, and barcode station"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Parcel Dimensioner contributors" }]
dependencies = []

[project.optional-dependencies]
touchscreen = [
  "Pillow>=10,<13",
  "numpy>=1.24,<3",
  "opencv-contrib-python-headless>=4.8,<5",
    "pyserial>=3.5,<4",
]
scale = ["pyserial>=3.5,<4"]
vision = [
  "numpy>=1.24,<3",
  "opencv-contrib-python-headless>=4.8,<5",
]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
parcel-dimensioner = "parcel_dimensioner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
